<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Lost in space · Vini</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="/favicon-64.png" type="image/png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@600;700&family=JetBrains+Mono:wght@500&display=swap" />
<style>
  :root { --bg: #f5f5f7; --surface: #fff; --ink: #121216; --muted: #5c5c68; --line: #dcdce2; --star: #9b1d3a; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --bg: #08080b; --surface: #111115; --ink: #ececf1; --muted: #9b9ba8; --line: #26262f; --star: #e0566f; color-scheme: dark; } }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--ink);
    font: 400 16px/1.6 "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  .sky { position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background-image: radial-gradient(1.2px 1.2px at 12% 18%, var(--muted), transparent), radial-gradient(1px 1px at 72% 12%, var(--muted), transparent),
      radial-gradient(1.4px 1.4px at 38% 72%, var(--muted), transparent), radial-gradient(1px 1px at 86% 64%, var(--muted), transparent),
      radial-gradient(1px 1px at 58% 38%, var(--muted), transparent), radial-gradient(1.2px 1.2px at 22% 88%, var(--muted), transparent),
      radial-gradient(600px circle at 50% 40%, color-mix(in srgb, var(--star) 12%, transparent), transparent 70%); opacity: .8; }
  main { width: min(520px, 100%); text-align: center; display: grid; justify-items: center; gap: 14px; }
  .logo { width: 88px; height: 88px; border-radius: 50%; border: 1px solid var(--line); box-shadow: 0 0 40px -6px var(--star); animation: float 5s ease-in-out infinite; }
  @keyframes float { 50% { transform: translateY(-8px) rotate(-4deg); } }
  .code { font: 500 .8rem "JetBrains Mono", ui-monospace, monospace; letter-spacing: .12em; color: var(--star); }
  h1 { font: 700 clamp(1.8rem, 6vw, 2.6rem)/1.1 "Space Grotesk", system-ui, sans-serif; letter-spacing: -.03em; margin: 0; }
  p { margin: 0; color: var(--muted); }
  nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 10px; }
  a { display: inline-flex; align-items: center; height: 42px; padding: 0 18px; border-radius: 999px; text-decoration: none; font: 600 .92rem "Space Grotesk", system-ui, sans-serif;
    color: var(--ink); border: 1px solid var(--line); background: var(--surface); transition: border-color .2s ease, transform .2s ease; }
  a:hover { border-color: var(--star); transform: translateY(-2px); }
  a.primary { background: var(--star); border-color: var(--star); color: #fff; }
  a:focus-visible { outline: 2px solid var(--star); outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) { .logo { animation: none; } a { transition: none; } }
</style>
</head>
<body>
<div class="sky" aria-hidden="true"></div>
<main>
  <img class="logo" src="/logo-vini-256.webp" alt="" width="88" height="88" />
  <span class="code">404 · OFF THE STAR MAP</span>
  <h1>This page drifted out of orbit</h1>
  <p>The link may be old or mistyped. Everything still lives on the main page.</p>
  <nav aria-label="Where to go">
    <a class="primary" href="/">Back to the portfolio</a>
    <a href="/#ai">Projects</a>
    <a href="/#resume">Résumé</a>
    <a href="/#contact">Contact</a>
  </nav>
</main>
</body>
</html>
