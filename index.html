<script>
  /* Saved accent / motion / grid apply before first paint (no flash). */
  try {
    var p = JSON.parse(localStorage.getItem("vini:prefs") || "{}"), r = document.documentElement;
    if (/^(dual|cyan|violet|emerald)$/.test(p.accent)) r.dataset.accent = p.accent;
    if (p.reduced === true) r.dataset.motion = "reduced";
    if (p.grid >= 0 && p.grid <= 100) r.style.setProperty("--grid", p.grid / 100);
  } catch (e) {}
</script>
