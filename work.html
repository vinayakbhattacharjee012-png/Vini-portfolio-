<script>
  /* Same saved look and Calm setting as the portfolio. */
  try {
    var t = localStorage.getItem("theme"), r = document.documentElement;
    if (/^(light|dark|black|hologram|nebula|terminal)$/.test(t)) r.setAttribute("data-theme", t);
    if (localStorage.getItem("calm") === "1") r.setAttribute("data-calm", "");
  } catch (e) {}
</script>
