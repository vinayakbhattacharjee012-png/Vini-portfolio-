<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>AI football commentator · Vini</title>
<meta name="description" content="Describe a football moment and hear it called like live TV commentary, with a crowd that roars at the big moments." />
<link rel="icon" href="../favicon-64.png" type="image/png" />
<meta name="theme-color" content="#08080b" media="(prefers-color-scheme: dark)" />
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)" />
<style>
  :root { --bg:#f5f5f7; --surface:#fff; --surface-2:#ececf0; --ink:#121216; --muted:#55555f; --line:#dcdce2; --accent:#167a3e; --hl:#d9f2e1; --err:#a8262e; --err-bg:#fbeaea; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --bg:#08080b; --surface:#121217; --surface-2:#1b1b22; --ink:#ececf1; --muted:#a3a3b0; --line:#2a2a33; --accent:#6fd99a; --hl:#163322; --err:#ff9a9f; --err-bg:#2a1216; color-scheme: dark; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 720px; margin: 0 auto; padding: max(18px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 40px max(16px, env(safe-area-inset-left)); display: grid; gap: 14px; }
  header p { margin: 4px 0 0; color: var(--muted); }
  h1 { font-size: 1.3rem; margin: 0; letter-spacing: -.01em; }
  h1 a { color: inherit; text-decoration: none; }
  button, textarea, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
  label { font-weight: 600; font-size: .95rem; }
  textarea { width: 100%; min-height: 96px; resize: vertical; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); }
  .examples { display: flex; flex-wrap: wrap; gap: 8px; list-style: none; margin: 0; padding: 0; }
  .examples button { border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 6px 12px; font-size: .85rem; text-align: left; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .btn { padding: 10px 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); font-weight: 600; }
  .btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .btn:disabled { opacity: .5; cursor: default; }
  .opts { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; font-size: .9rem; color: var(--muted); }
  .opts label { font-weight: 500; display: inline-flex; gap: 6px; align-items: center; }
  select { padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); max-width: 220px; }
  .status:empty { display: none; }
  .status { padding: 10px 14px; border-radius: 12px; background: var(--surface-2); display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  .status.error { background: var(--err-bg); color: var(--err); }
  #out[hidden] { display: none; }
  .commentary { font-size: 1.12rem; line-height: 1.7; margin: 0; }
  .commentary span { border-radius: 4px; transition: background-color .2s ease; }
  .commentary span.on { background: var(--hl); }
  footer { color: var(--muted); font-size: .8rem; }
  footer a { color: inherit; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><a href="../">Vini</a> · AI football commentator</h1>
    <p>Describe a moment. Get it called like live TV, with the crowd.</p>
  </header>

  <form class="card" id="form">
    <label for="moment">The moment</label>
    <textarea id="moment" maxlength="500" required placeholder="e.g. 93rd minute, our number 9 curls a free kick into the top corner to win the derby"></textarea>
    <ul class="examples" aria-label="Example moments">
      <li><button type="button">93rd minute, the number 9 curls a free kick into the top corner to win the derby</button></li>
      <li><button type="button">A 19-year-old winger dribbles past four defenders and chips the keeper</button></li>
      <li><button type="button">Sudden-death penalties, and the keeper saves with his trailing foot</button></li>
      <li><button type="button">Bicycle kick from the edge of the box in a cup final</button></li>
    </ul>
    <div class="row">
      <button class="btn primary" type="submit" id="go">Commentate</button>
      <div class="opts">
        <label><input type="checkbox" id="crowd" checked /> Crowd noise</label>
        <label>Voice <select id="voice" aria-label="Commentator voice"><option value="">Default</option></select></label>
      </div>
    </div>
  </form>

  <div class="status" id="status" role="status" aria-live="polite"></div>

  <section class="card" id="out" hidden aria-labelledby="outH">
    <h2 id="outH" class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Commentary</h2>
    <p class="commentary" id="text"></p>
    <div class="row">
      <button class="btn primary" type="button" id="play">▶ Play</button>
      <button class="btn" type="button" id="stop" disabled>■ Stop</button>
      <button class="btn" type="button" id="copy">Copy text</button>
    </div>
  </section>

  <footer>Commentary is written by AI (Gemini) and read by your browser's voice. Names and details come from what you type. <a href="../">Back to the portfolio</a></footer>
</div>

<script>
(function () {
  "use strict";
  var PROXY = (window.VEGA_PROXY || "https://vega-gemini.onrender.com").replace(/\/$/, "");
  var TIMEOUT_MS = 70000; // the free server sleeps when idle; waking it can take most of a minute
  var $ = function (id) { return document.getElementById(id); };
  var synth = window.speechSynthesis, retry = null, sentences = [], playing = false;

  function setStatus(kind, text, canRetry) {
    var s = $("status"); s.textContent = ""; s.className = "status" + (kind === "error" ? " error" : "");
    s.setAttribute("role", kind === "error" ? "alert" : "status");
    if (!text) return;
    var span = document.createElement("span"); span.textContent = text; s.appendChild(span);
    if (canRetry && retry) { var b = document.createElement("button"); b.type = "button"; b.className = "btn"; b.textContent = "Retry"; b.addEventListener("click", function () { retry(); }); s.appendChild(b); }
  }

  // ---------- AI ----------
  function commentate(moment) {
    retry = function () { commentate(moment); };
    if (navigator.onLine === false) { setStatus("error", "You're offline. Reconnect, then press Retry.", true); return; }
    stop();
    $("go").disabled = true;
    setStatus("info", "Writing the commentary…");
    var slow = setTimeout(function () { setStatus("info", "Warming up the commentator. The server naps when it's quiet, so the first call can take up to a minute…"); }, 5000);
    var ac = new AbortController(), t = setTimeout(function () { ac.abort(); }, TIMEOUT_MS);
    fetch(PROXY + "/ask", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ question: moment, mode: "commentary" }), signal: ac.signal })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { return { ok: r.ok, status: r.status, j: j }; }); })
      .then(function (res) {
        if (!res.ok || !res.j.answer) {
          var msg = res.j.error || ("The commentator had a problem (HTTP " + res.status + ").");
          if (res.status === 403 && location.hostname !== "vini-portfolio.onrender.com") msg += " It only works on vini-portfolio.onrender.com.";
          setStatus("error", msg, res.status !== 403 && res.status !== 400);
          return;
        }
        show(res.j.answer); setStatus("", "");
        $("play").focus();
      })
      .catch(function (e) {
        setStatus("error", e && e.name === "AbortError" ? "The commentator took too long to answer." : navigator.onLine === false ? "You're offline. Reconnect, then press Retry." : "Couldn't reach the commentator. Check your connection.", true);
      })
      .finally(function () { clearTimeout(slow); clearTimeout(t); $("go").disabled = false; });
  }

  function show(text) {
    var p = $("text"); p.textContent = "";
    sentences = (text.match(/[^.!?…]+[.!?…]+["'”’]*\s*|[^.!?…]+$/g) || [text]).map(function (s) { return s.trim(); }).filter(Boolean);
    sentences.forEach(function (s, i) { var span = document.createElement("span"); span.textContent = s + " "; span.dataset.i = i; p.appendChild(span); });
    $("out").hidden = false;
  }

  // ---------- Crowd (synthesised noise, no audio files) ----------
  var ac = null, crowdGain = null, crowdSrc = null;
  function crowdStart() {
    if (!$("crowd").checked) return;
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      ac.resume();
      var len = ac.sampleRate * 2, buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0), last = 0;
      for (var i = 0; i < len; i++) { last = 0.97 * last + 0.03 * (Math.random() * 2 - 1); d[i] = last * 6; } // soft brown-ish noise = distant crowd
      crowdSrc = ac.createBufferSource(); crowdSrc.buffer = buf; crowdSrc.loop = true;
      var band = ac.createBiquadFilter(); band.type = "bandpass"; band.frequency.value = 700; band.Q.value = 0.5;
      crowdGain = ac.createGain(); crowdGain.gain.setValueAtTime(0.0001, ac.currentTime); crowdGain.gain.exponentialRampToValueAtTime(0.05, ac.currentTime + 0.8);
      crowdSrc.connect(band); band.connect(crowdGain); crowdGain.connect(ac.destination); crowdSrc.start();
    } catch (e) { crowdGain = null; }
  }
  function crowdSwell(big) {
    if (!crowdGain) return;
    var g = crowdGain.gain, now = ac.currentTime;
    g.cancelScheduledValues(now); g.setValueAtTime(Math.max(0.0001, g.value), now);
    g.exponentialRampToValueAtTime(big ? 0.28 : 0.09, now + (big ? 0.35 : 0.6));
    g.exponentialRampToValueAtTime(0.05, now + (big ? 3 : 1.5));
  }
  function crowdStop() {
    if (!crowdGain || !ac) return;
    var g = crowdGain.gain, now = ac.currentTime, src = crowdSrc;
    g.cancelScheduledValues(now); g.setValueAtTime(Math.max(0.0001, g.value), now); g.exponentialRampToValueAtTime(0.0001, now + 0.8);
    setTimeout(function () { try { src.stop(); } catch (e) {} }, 900);
    crowdGain = null; crowdSrc = null;
  }

  // ---------- Voice ----------
  function voices() { return synth ? synth.getVoices().filter(function (v) { return /^en/i.test(v.lang); }) : []; }
  function fillVoices() {
    var sel = $("voice"), keep = sel.value || (function () { try { return localStorage.getItem("cm.voice") || ""; } catch (e) { return ""; } })();
    sel.length = 1;
    voices().forEach(function (v) { var o = document.createElement("option"); o.value = v.name; o.textContent = v.name + " (" + v.lang + ")"; sel.appendChild(o); });
    if (keep && voices().some(function (v) { return v.name === keep; })) sel.value = keep;
  }
  function pickVoice() {
    var all = voices(), name = $("voice").value;
    return all.find(function (v) { return v.name === name; }) || all.find(function (v) { return /en-GB/i.test(v.lang); }) || all[0] || null;
  }

  function play() {
    if (!sentences.length) return;
    if (!synth || !window.SpeechSynthesisUtterance) { setStatus("error", "This browser can't read text aloud. The commentary is above to read yourself.", false); return; }
    stop();
    playing = true; $("play").disabled = true; $("stop").disabled = false;
    crowdStart();
    var voice = pickVoice(), spans = $("text").children;
    sentences.forEach(function (s, i) {
      var u = new SpeechSynthesisUtterance(s), big = /!|\b[A-Z]{3,}\b/.test(s);
      if (voice) u.voice = voice;
      u.rate = big ? 1.18 : 1.05; u.pitch = big ? 1.25 : 1.05; u.volume = 1;
      u.onstart = function () { [].forEach.call(spans, function (sp) { sp.classList.remove("on"); }); if (spans[i]) spans[i].classList.add("on"); crowdSwell(big); };
      if (i === sentences.length - 1) u.onend = u.onerror = function () { finish(); };
      synth.speak(u);
    });
  }
  function finish() {
    playing = false; crowdStop();
    [].forEach.call($("text").children, function (sp) { sp.classList.remove("on"); });
    $("play").disabled = false; $("stop").disabled = true;
  }
  function stop() { if (synth) synth.cancel(); finish(); }

  // ---------- Wiring ----------
  $("form").addEventListener("submit", function (e) {
    e.preventDefault();
    var m = $("moment").value.trim();
    if (m.length < 8) { setStatus("error", "Describe the moment in a few more words.", false); $("moment").focus(); return; }
    commentate(m);
  });
  document.querySelectorAll(".examples button").forEach(function (b) { b.addEventListener("click", function () { $("moment").value = b.textContent; $("moment").focus(); }); });
  $("play").addEventListener("click", play);
  $("stop").addEventListener("click", stop);
  $("copy").addEventListener("click", function () {
    var text = sentences.join(" ");
    (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(function () { setStatus("info", "Copied."); }, function () { setStatus("error", "Couldn't copy. Select the text and copy it yourself.", false); });
  });
  $("voice").addEventListener("change", function () { try { localStorage.setItem("cm.voice", $("voice").value); } catch (e) {} });
  if (synth) { fillVoices(); synth.addEventListener ? synth.addEventListener("voiceschanged", fillVoices) : (synth.onvoiceschanged = fillVoices); }
  window.addEventListener("pagehide", stop);
})();
</script>
</body>
</html>
